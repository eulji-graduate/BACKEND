name: CD (Spring Deploy)

# 로컬 시연 전용: main push로 실행하지 않으며, 수동 실행도 안내만 출력한다.
# AWS 인증·Docker Hub 업로드·SSM 배포 단계는 제거했다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-disabled:
    name: Deployment disabled (local demo)
    runs-on: ubuntu-latest
    steps:
      - name: Explain local-only execution
        run: echo "Deployment is disabled. Run the backend locally; CI only validates tests and builds."
