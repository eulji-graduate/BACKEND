services:
  mysql:
    image: mysql:8.0.40
    restart: unless-stopped

    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"

    environment:
      MYSQL_DATABASE: "${DB_NAME:-momo}"
      MYSQL_USER: "${DB_USERNAME:-momo}"
      MYSQL_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      TZ: Asia/Seoul

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

    volumes:
      - mysql-local-data:/var/lib/mysql
      # 비어 있는 MySQL 볼륨에서만 실행한다. 앱 재시작 시에는 데이터가 유지된다.
      - ./src/main/resources/db/local/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/local/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro

    healthcheck:
      # ping만으로는 계정·DB 준비를 확인할 수 없어 실제 앱 계정으로 쿼리한다.
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h 127.0.0.1 -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}" -e 'SELECT 1' >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:8.8.1-alpine
    container_name: z-redis-local
    restart: unless-stopped

    ports:
      - "127.0.0.1:6379:6379"

    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"

    command:
      - sh
      - -ec
      - |
        # Compose 필수값 검사와 별도로 컨테이너 안에서도 빈 비밀번호 실행을 막는다.
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required — 프로젝트 루트 .env 를 확인하세요(.env.example 참고)}"

        exec redis-server \
          --appendonly yes \
          --appendfsync everysec \
          --requirepass "$${REDIS_PASSWORD}"

    volumes:
      - redis-local-data:/data

    mem_limit: 256m

    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-local-data:
  redis-local-data:
