# 실행: ./gradlew bootRun --args='--spring.profiles.active=local'
# 백엔드는 호스트에서, MySQL·Redis는 Docker에서 실행하는 구성이다.
# 비밀값은 기존 루트 application-secret.yml 또는 환경변수로 제공한다.
# Spring은 Docker Compose용 .env를 자동으로 읽지 않는다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:momo}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:momo}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: validate

  # SQL은 DB 초기화 절차에서 별도로 적용한다. 앱 재시작 시 더미 데이터를 다시 넣지 않는다.
  sql:
    init:
      mode: never

server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8080}
  # 로컬 직접 접속에는 리버스 프록시의 전달 헤더를 사용하지 않는다.
  forward-headers-strategy: none

app:
  local-assembly:
    ffmpeg: ${LOCAL_FFMPEG_PATH:ffmpeg}
    ffprobe: ${LOCAL_FFPROBE_PATH:ffprobe}
    timeout-seconds: ${LOCAL_ASSEMBLY_TIMEOUT_SECONDS:600}
  local-storage:
    root: ${LOCAL_STORAGE_ROOT:.local/storage}
    base-url: ${LOCAL_STORAGE_BASE_URL:http://localhost:${server.port:8080}}
    max-upload-bytes: ${LOCAL_STORAGE_MAX_UPLOAD_BYTES:5368709120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  # AI 담당자의 서버와 같은 값을 사용한다. 기본 토큰을 코드에 두지 않는다.
  internal-token: ${INTERNAL_TOKEN}
